<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: lantern-image:; style-src 'self'; script-src 'self'; connect-src 'self'"><title>Lantern · 聊天</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="shell">
  <header class="topbar">
    <button id="home" class="brand-home" data-view="chat" aria-label="返回聊天"><span class="brand-mark">L</span><strong>Lantern</strong></button>
    <h1 id="page-title" class="sr-only">聊天</h1>
    <nav aria-label="主导航" class="top-actions"><button id="screenshot" class="button"><span data-icon="crop"></span>截图</button><button class="button nav" data-view="files"><span data-icon="folder"></span>文件管理</button><button class="button nav" data-view="settings"><span data-icon="settings"></span>设置</button></nav>
  </header>
  <aside class="sidebar" aria-label="设备列表">
    <div class="side-label">你的设备 <button id="connect" aria-label="连接新设备">＋</button></div><div id="peers" class="peers"></div>
    <div class="nearby"><div class="side-label">附近的设备</div><div id="nearby"></div><button id="manual" class="link">手动连接</button></div>
    <div class="self"><span class="device-dot"></span><div><strong id="self-name">正在启动…</strong><small id="self-address">读取本机地址</small></div></div>
  </aside>
  <main>
    <section id="chat" class="view chat-view"><div class="conversation-head"><div class="avatar" data-icon="monitor"></div><div><h2 id="chat-name">选择一台设备</h2><p id="chat-status">配对后，即可开始聊天和传文件</p></div><button id="chat-files" class="button">查看文件</button></div><div id="timeline" class="timeline"></div>
      <div class="composer"><div id="attachments" class="attachments"></div><div class="compose-tools"><button id="attach-file" class="icon-label"><span data-icon="file"></span>文件</button><button id="attach-folder" class="icon-label"><span data-icon="folder"></span>文件夹</button><span>也可以直接拖入文件，或粘贴截图</span></div><label class="sr-only" for="message">聊天消息</label><textarea class="resize-none" id="message" placeholder="输入消息…" maxlength="16000"></textarea><div class="compose-bottom"><span>Enter 发送 · Shift + Enter 换行</span><button id="send" class="button primary">发送 <span data-icon="arrow"></span></button></div></div>
    </section>
    <section id="files" class="view files-view" hidden><div class="file-top"><h2>文件管理</h2><button id="add-root" class="button primary">＋ 添加本地目录</button></div><div id="locations" class="location-tabs"></div><div id="breadcrumb" class="breadcrumb"></div>
      <div class="filters"><div class="search"><span data-icon="search"></span><input id="search" aria-label="搜索文件名" placeholder="搜索文件名"><button id="clear-search" aria-label="清除搜索" hidden>×</button></div><select id="type-filter" aria-label="文件类型"><option value="">所有类型</option><option value="image">图片</option><option value="document">文档</option><option value="video">视频</option><option value="archive">压缩包</option><option value="folder">文件夹</option><option value="other">其他</option></select><select id="status-filter" aria-label="传输状态"><option value="">所有状态</option><option>已完成</option><option>传输中</option><option>失败</option><option>已中断</option><option>已取消</option><option>等待接收</option></select><select id="date-filter" aria-label="文件日期"><option value="">所有日期</option><option value="1">最近一天</option><option value="7">最近七天</option><option value="30">最近三十天</option></select><select id="size-filter" aria-label="文件大小"><option value="">所有大小</option><option value="large">大于 100 MB</option><option value="small">不超过 100 MB</option></select></div>
      <div class="bulk"><span id="selected-count">未选择文件</span><button class="button" data-bulk="send">发送</button><button class="button" data-bulk="copy">复制到</button><button class="button" data-bulk="move">移动到</button><button class="button danger" data-bulk="trash">移入回收站</button><button id="refresh-files" class="link">刷新</button></div>
      <div class="table-scroll"><table aria-label="文件列表"><thead><tr><th class="check-col"><input id="select-page" type="checkbox" aria-label="选择本页可操作的文件"></th><th aria-sort="ascending"><button id="sort-name">名称 ↕</button></th><th>大小</th><th>时间</th><th>来源 / 状态</th><th>操作</th></tr></thead><tbody id="file-rows"></tbody></table><div id="file-empty" class="empty" hidden></div></div><footer class="pagination"><span id="range"></span><div><button id="prev" class="button">上一页</button><span id="page-number"></span><button id="next" class="button">下一页</button></div></footer>
    </section>
    <section id="settings" class="view settings-view" hidden><h2>设置</h2><form id="settings-form" novalidate><div class="settings-group"><h3>设备</h3><label for="device-name">设备名称</label><input id="device-name" maxlength="80" required><p>其他设备会看到这个名称，保存后重启更新广播名称。</p><label for="shortcut">截图快捷键</label><input id="shortcut" placeholder="Alt+Shift+S"><p id="shortcut-help">在任意应用中唤出区域截图，确认后复制到剪贴板。</p></div><div class="settings-group"><h3>文件接收</h3><label class="toggle-row"><span><strong>自动接收已配对设备的文件</strong><small>关闭后，每个文件都需要你确认。</small></span><input id="auto-receive" type="checkbox" role="switch"></label><label>接收目录</label><div class="path-row"><code id="download-dir"></code><button id="choose-download" type="button" class="button">更改目录</button></div></div><div class="settings-group"><h3>连接此电脑</h3><div class="pairing-code" id="pairing-code"></div><p>配对码每五分钟更新，配对成功后立即更换。</p><p>本机连接地址：<code id="settings-address"></code></p><details><summary>设备证书指纹（首次配对时核对）</summary><code id="fingerprint"></code></details></div><p id="settings-error" class="error" role="alert"></p><button class="button primary" type="submit">保存设置</button></form><div class="settings-group"><h3>已信任的设备</h3><div id="trusted"></div></div></section>
    <footer class="app-footer"><span><i></i> 局域网直连</span><span id="transfer-summary">没有进行中的传输</span></footer>
  </main>
</div>
<dialog id="modal" aria-labelledby="modal-title"><form id="modal-form" novalidate><div class="modal-heading"><h2 id="modal-title"></h2><button id="modal-close" type="button" class="icon-label" aria-label="关闭对话框">×</button></div><div id="modal-body"></div><p id="modal-error" class="error" role="alert"></p><div class="modal-actions"><button id="modal-cancel" type="button" class="button">取消</button><button id="modal-submit" type="submit" class="button primary">继续</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div><script src="app.js"></script>
</body></html>
